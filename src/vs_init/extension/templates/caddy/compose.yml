services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--watch"]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - data:/data
      - config:/config
      - /opt/vertigis-studio/certs/live:/opt/vertigis-studio/certs/live:ro
      - /opt/vertigis-studio/certs/root:/etc/ssl/certs:ro
      - .:/etc/caddy:ro
    networks:
      - default
      - caddy

volumes:
  data: {}
  config: {}

networks:
  default: {}
  caddy:
    name: caddy
    internal: true
