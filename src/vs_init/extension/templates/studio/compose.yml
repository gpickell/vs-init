services:
  studio:
    image: ghcr.io/vertigis/studio/base:latest
    restart: unless-stopped
    environment:
      # Comment will be the title of the item in your portal.
      ARCGIS_APP_ID: your_app_id # VertiGIS Studio
      ARCGIS_PORTAL_URL: https://www.arcgis.com
      VERTIGIS_ACCOUNT_ID: your_account_id
      # Keep comment as is for Caddy tooling.
      FRONTEND_URL: https://your-studio.contoso.com/path # caddy route url
      VERTIGIS_PURGE: 1
      VERTIGIS_WORKERS: 8
    volumes:
      - /opt/vertigis-studio/certs/root:/etc/ssl/certs:ro
      - data:/data
      - logs:/var/log
      - temp:/stmp
    networks:
      default: {}
      caddy:
        aliases:
          - studio.studio-1.int # caddy route target:8080

networks:
  default: {}
  caddy:
    name: caddy
    external: true

volumes:
  data: {}
  logs: {}
  temp: {}
